databases:
  - name: aemipn-db
    databaseName: aemipn
    plan: free
    region: oregon

services:
  - type: web
    name: aemipn-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build -w @aemipn/api
    startCommand: npm run db:deploy -w @aemipn/api && npm start -w @aemipn/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.20.2
      # Sin esto, npm install se salta las devDependencies por ver NODE_ENV=production
      # y el build de TypeScript truena por no encontrar @types/node.
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: aemipn-db
          property: connectionString
      # Dominio del Static Site (aemipn-web). Ajusta si Render le puso otro nombre.
      - key: CORS_ORIGIN
        value: https://aemipn-web.onrender.com
      - key: APP_URL
        value: https://aemipn-web.onrender.com
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_CUENTAS_DEMO
        value: "false"
      - key: EXPONER_CODIGOS_DE_PRUEBA
        value: "false"
      # El plan free de Render bloquea los puertos SMTP (25/465/587): SMTP_URL
      # no sirve aqui. BREVO_API_KEY manda por HTTPS y tiene prioridad sobre
      # SMTP_URL si ambas estan presentes. Sin ninguna, el correo de
      # verificacion solo se imprime en los logs.
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_URL
        sync: false
      - key: SMTP_REMITENTE
        value: "AEMIPN <no-responder@aemipn.mx>"
      # Notificaciones push (eventos nuevos, recordatorio de "voy a asistir").
      # Se generan UNA sola vez en local con `npx web-push generate-vapid-keys`
      # y se pegan aqui a mano; sin ellas el envio se salta en silencio.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: "mailto:no-responder@aemipn.mx"

  # Revisa cada hora quien confirmo una salida que empieza en ~24 horas y le
  # manda el recordatorio push. Aparte del web service porque un Cron Job de
  # Render corre exista o no trafico en el sitio -un proceso en segundo plano
  # del web service normal no es confiable en el plan gratuito, que se apaga
  # solo tras estar inactivo.
  #
  # Los Cron Jobs de Render no tienen nivel gratuito: cobran por segundo de
  # ejecucion real, con un minimo de 1 USD/mes por servicio sin importar el
  # plan. "0.5c-512mb" es el mas chico que ofrecen -de sobra para una consulta
  # a la base y unos cuantos push por corrida.
  - type: cron
    name: aemipn-recordatorios
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    schedule: "0 * * * *"
    buildCommand: npm install && npm run build -w @aemipn/api
    startCommand: npm run recordatorios -w @aemipn/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.20.2
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: aemipn-db
          property: connectionString
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: "mailto:no-responder@aemipn.mx"

  - type: web
    name: aemipn-web
    runtime: static
    buildCommand: npm install && npm run build -w @aemipn/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
    routes:
      # Mismo origen para el navegador: la cookie de sesion (SameSite=Lax)
      # solo funciona si el sitio y la API se ven como un mismo dominio.
      - type: rewrite
        source: /api/*
        destination: https://aemipn-api.onrender.com/api/*
      - type: rewrite
        source: /uploads/*
        destination: https://aemipn-api.onrender.com/uploads/*
      # Client-side routing de React Router.
      - type: rewrite
        source: /*
        destination: /index.html
